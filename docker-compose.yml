x-pg: &pg
  image: postgres:16
  environment:
    POSTGRES_USER: app
    POSTGRES_PASSWORD: app
    POSTGRES_DB: app
  command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
  cpus: 1.0        # small, equal limits make a single node saturate early
  mem_limit: 1g

services:
  pg-baseline:
    <<: *pg
    ports: ["5440:5432"]
    volumes:
      - baseline_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  shard0:
    <<: *pg
    ports: ["5441:5432"]
    volumes:
      - shard0_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  shard1:
    <<: *pg
    ports: ["5442:5432"]
    volumes:
      - shard1_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  shard2:
    <<: *pg
    ports: ["5443:5432"]
    volumes:
      - shard2_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  shard3:
    <<: *pg
    ports: ["5444:5432"]
    volumes:
      - shard3_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  baseline_data:
  shard0_data:
  shard1_data:
  shard2_data:
  shard3_data: